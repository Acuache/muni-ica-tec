<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Muni Tec — Nueva plataforma · Municipalidad Provincial de Ica</title>
<!--
  Fuente editable del anuncio. Referencia logos y fuentes por ruta relativa al repo.
  Para el entregable autónomo (base64 embebido) corre:  node anuncio/construir.mjs
  Para el PNG:                                            node anuncio/exportar-png.mjs
-->
<style>
  @font-face {
    font-family: 'Roboto Slab';
    src: url('../app/fonts/roboto-slab-latin.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: 'Geist';
    src: url('../app/fonts/geist-latin.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }

  :root {
    /* Paleta del escudo oficial (assets/muni-ica.png), muestreada del PNG */
    --verde: #1CA027;
    --verde-dark: #147C1D;
    --uva: #822A8C;
    --naranja: #EE8B3E;
    --escudo: linear-gradient(120deg, var(--verde) 0%, var(--uva) 52%, var(--naranja) 100%);

    --white: #FFFFFF;
    --ink: #262626;            /* texto ~ escudo #313131 */
    --muted: #6B6B6B;
    --cream: #FFFFC8;          /* fondo EXACTO del logo Muni Tec (tile) */
    --line: rgba(38, 38, 38, 0.10);
    --radius: 40px;
    --sans: 'Geist', system-ui, -apple-system, Segoe UI, sans-serif;
    --slab: 'Roboto Slab', Georgia, serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: #e9e9e9; }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: var(--white);
    font-family: var(--sans);
    color: var(--ink);
  }

  /* Marco interior sutil */
  .frame {
    position: absolute;
    inset: 40px;
    border: 2px solid var(--line);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 72px 64px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--verde);
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 5px;
    text-transform: uppercase;
    padding: 12px 26px;
    border-radius: 999px;
    box-shadow: 0 8px 22px rgba(28, 160, 39, 0.35);
  }
  .chip .spark { width: 9px; height: 9px; border-radius: 999px; background: #fff; }

  /* Logo Muni Tec (muni-tec-hover.png, verde con ícono/texto amarillo) como tile redondeado */
  .logo-tile {
    flex: none;                 /* no encoger: evita que overflow:hidden recorte el logo */
    border-radius: 46px;
    overflow: hidden;
    line-height: 0;
    margin: 28px 0 8px;
    box-shadow: 0 26px 55px rgba(38, 38, 38, 0.18), 0 5px 14px rgba(38, 38, 38, 0.10);
  }
  .logo {
    width: 300px;
    height: auto;
    display: block;
  }

  .title {
    font-family: var(--slab);
    font-weight: 800;
    font-size: 92px;
    line-height: 0.98;
    letter-spacing: -1px;
    margin-top: 8px;
  }
  .title .hl {
    position: relative;
    white-space: nowrap;
  }
  .title .hl::after {
    content: "";
    position: absolute;
    left: -4px; right: -4px; bottom: 10px;
    height: 20px;
    background: var(--verde);
    z-index: -1;
    border-radius: 4px;
    opacity: 0.85;
  }

  .subtitle {
    font-size: 27px;
    line-height: 1.42;
    color: var(--muted);
    max-width: 660px;
    margin-top: 26px;
  }
  .subtitle b { color: var(--ink); font-weight: 600; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    margin-top: 30px;
    padding: 11px 22px;
    border: 2px solid var(--line);
    border-radius: 999px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .badge .dot {
    width: 12px; height: 12px; border-radius: 999px;
    background: var(--verde);
    box-shadow: 0 0 0 4px rgba(28, 160, 39, 0.22);
  }

  .url {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: 22px;
    padding: 15px 32px;
    background: var(--verde);
    color: #fff;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 0.3px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 12px 28px rgba(28, 160, 39, 0.34);
  }
  .url svg { width: 25px; height: 25px; flex: none; }

  .divider {
    width: 150px;
    height: 5px;
    border-radius: 999px;
    background: var(--escudo);
    margin: 40px 0 30px;
  }

  .footer {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-top: 56px;
  }
  .footer .escudo {
    height: 94px;
    width: auto;
    mix-blend-mode: multiply;   /* el fondo blanco del PNG desaparece sobre el lienzo blanco */
  }
  .footer .sep {
    width: 2px;
    height: 64px;
    background: var(--line);
  }
  .footer .org {
    text-align: left;
    line-height: 1.25;
  }
  .footer .org .eyebrow {
    font-size: 14px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .footer .org .unit {
    font-family: var(--slab);
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 3px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="frame">
      <div class="chip"><span class="spark"></span>Nueva plataforma</div>

      <div class="logo-tile">
        <img class="logo" src="../public/logo/muni-tec-hover.png" alt="Muni Tec — Soporte Técnico">
      </div>

      <h1 class="title">¡Ya está <span class="hl">aquí!</span></h1>

      <p class="subtitle">
        La nueva plataforma para <b>pedir y atender soporte técnico</b>
        en la Municipalidad Provincial de Ica.
      </p>

      <div class="badge"><span class="dot"></span>En marcha · Julio 2026</div>

      <a class="url" href="https://muni-ica-tec.vercel.app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></svg>
        muni-ica-tec.vercel.app
      </a>

      <div class="footer">
        <img class="escudo" src="../assets/muni-ica.png" alt="Municipalidad Provincial de Ica">
        <div class="sep"></div>
        <div class="org">
          <div class="eyebrow">Creado por</div>
          <div class="unit">Unidad de Tecnologías de Información</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
