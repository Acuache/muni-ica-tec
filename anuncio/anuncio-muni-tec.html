  :root {
    /* Paleta del escudo oficial (assets/muni-ica.png), muestreada del PNG */
    --verde: #1CA027;
    --verde-dark: #147C1D;
    --uva: #822A8C;
    --naranja: #EE8B3E;
    --escudo: linear-gradient(120deg, var(--verde) 0%, var(--uva) 52%, var(--naranja) 100%);

    --white: #FFFFFF;
    --ink: #262626;            /* texto ~ escudo #313131 */
    --muted: #6B6B6B;
    --cream: #FFFFC8;          /* fondo EXACTO del logo Muni Tec (tile) */
    --line: rgba(38, 38, 38, 0.10);
    --radius: 40px;
    --sans: 'Geist', system-ui, -apple-system, Segoe UI, sans-serif;
    --slab: 'Roboto Slab', Georgia, serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: #e9e9e9; }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: var(--white);
    font-family: var(--sans);
    color: var(--ink);
  }

  /* Marco interior sutil */
  .frame {
    position: absolute;
    inset: 40px;
    border: 2px solid var(--line);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 72px 64px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--verde);
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 5px;
    text-transform: uppercase;
    padding: 12px 26px;
    border-radius: 999px;
    box-shadow: 0 8px 22px rgba(28, 160, 39, 0.35);
  }
  .chip .spark { width: 9px; height: 9px; border-radius: 999px; background: #fff; }

  /* Logo Muni Tec (muni-tec-hover.png, verde con ícono/texto amarillo) como tile redondeado */
  .logo-tile {
    flex: none;                 /* no encoger: evita que overflow:hidden recorte el logo */
    border-radius: 46px;
    overflow: hidden;
    line-height: 0;
    margin: 28px 0 8px;
    box-shadow: 0 26px 55px rgba(38, 38, 38, 0.18), 0 5px 14px rgba(38, 38, 38, 0.10);
  }
  .logo {
    width: 300px;
    height: auto;
    display: block;
  }

  .title {
    font-family: var(--slab);
    font-weight: 800;
    font-size: 92px;
    line-height: 0.98;
    letter-spacing: -1px;
    margin-top: 8px;
  }
  .title .hl {
    position: relative;
    white-space: nowrap;
  }
  .title .hl::after {
    content: "";
    position: absolute;
    left: -4px; right: -4px; bottom: 10px;
    height: 20px;
    background: var(--verde);
    z-index: -1;
    border-radius: 4px;
    opacity: 0.85;
  }

  .subtitle {
    font-size: 27px;
    line-height: 1.42;
    color: var(--muted);
    max-width: 660px;
    margin-top: 26px;
  }
  .subtitle b { color: var(--ink); font-weight: 600; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    margin-top: 30px;
    padding: 11px 22px;
    border: 2px solid var(--line);
    border-radius: 999px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .badge .dot {
    width: 12px; height: 12px; border-radius: 999px;
    background: var(--verde);

  .footer .org {

    font-weight: 700;
